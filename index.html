<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ГТО PRO_TRACKER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="storage.js"></script>
    <script src="data.js"></script>
    <style>
        .lace-pattern { background-image: radial-gradient(circle at center, rgba(255,255,255,0.15) 2px, transparent 2.5px), radial-gradient(circle at center, rgba(255,255,255,0.1) 1px, transparent 1.5px); background-size: 24px 24px, 12px 12px; background-position: 0 0, 12px 12px; }
        .animate-toast { animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideDown { from { transform: translate(-50%, -120%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-20 selection:bg-blue-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const App = () => {
            const [view, setView] = useState('training');
            const [gender, setGender] = useState('М');
            const [inputs, setInputs] = useState({});
            const [dailyData, setDailyData] = useState({});
            const [userName, setUserName] = useState('Атлет');
            const [userId, setUserId] = useState(null);
            const [userPhoto, setUserPhoto] = useState(null);
            const [toast, setToast] = useState(null);

            const todayStr = new Date().toISOString().split('T')[0];

            useEffect(() => {
                if (window.Telegram?.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (tgUser) {
                        setUserName(tgUser.first_name);
                        setUserId(tgUser.id.toString());
                        setUserPhoto(tgUser.photo_url || null);
                    }
                }
                const load = async () => {
                    const g = await window.AppStorage.getItem(`gto_${userId}_${gender}`);
                    const d = await window.AppStorage.getItem(`gto_daily_${userId}`);
                    if (g) setInputs(JSON.parse(g));
                    if (d) setDailyData(JSON.parse(d));
                };
                if (userId) load();
            }, [userId, gender]);

            const switchView = (v) => { window.triggerHaptic('selection'); setView(v); };

            const renderTraining = () => {
    const isDayLocked = (dStr) => Object.values(dailyData[dStr] || {}).some(ex => ex?.isLocked);
    const todayData = dailyData[todayStr] || {};
    const hasUnlockedData = Object.keys(todayData).some(ex => {
        const exData = todayData[ex];
        return !exData.isLocked && Object.keys(exData).some(k => k !== 'isLocked' && exData[k] !== '' && exData[k] !== 0);
    });
    const hasLockedData = Object.values(todayData).some(ex => ex.isLocked);

    return (
        <div className="px-4 space-y-6 pt-6 pb-6 mb-6">
            <h2 className="text-sm font-black text-slate-400 uppercase tracking-widest ml-2 mb-2">Ежедневный трекинг</h2>
            
            {/* Карточка бега */}
            <div className="bg-white p-5 rounded-3xl shadow-sm relative" style={{ opacity: dailyData[todayStr]?.run?.isLocked ? 0.7 : 1 }}>
                <div className="flex items-center gap-3 mb-4">
                    <div className="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center text-xl">🏃‍♂️</div>
                    <div><h3 className="font-bold text-slate-800">Бег</h3></div>
                </div>
                <div className="flex gap-3">
                    <input type="text" placeholder="КМ" value={dailyData[todayStr]?.run?.km || ''} onChange={(e) => handleDailyInput('run', 'km', e.target.value)} disabled={dailyData[todayStr]?.run?.isLocked} className="w-full bg-slate-50 p-3 rounded-xl text-right font-mono text-blue-600" />
                    <input type="text" placeholder="МИН:С" value={dailyData[todayStr]?.run?.time || ''} onChange={(e) => handleDailyInput('run', 'time', e.target.value)} disabled={dailyData[todayStr]?.run?.isLocked} className="w-full bg-slate-50 p-3 rounded-xl text-right font-mono text-blue-600" />
                </div>
            </div>

            {/* Карточка отжиманий */}
            <div className="bg-white p-5 rounded-3xl shadow-sm relative" style={{ opacity: dailyData[todayStr]?.pushups?.isLocked ? 0.7 : 1 }}>
                <div className="flex items-center gap-3 mb-4">
                    <div className="w-10 h-10 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center text-xl">💪</div>
                    <div><h3 className="font-bold text-slate-800">Отжимания</h3></div>
                </div>
                <div className="flex items-center justify-between px-4">
                    <button onClick={() => updatePushups(-1)} disabled={dailyData[todayStr]?.pushups?.isLocked} className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center">-</button>
                    <span className="text-3xl font-black">{dailyData[todayStr]?.pushups?.count || 0}</span>
                    <button onClick={() => updatePushups(1)} disabled={dailyData[todayStr]?.pushups?.isLocked} className="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center">+</button>
                </div>
            </div>

            {/* Кнопка записи */}
            {hasUnlockedData && (
                <button onClick={lockTodayTraining} className="w-full bg-blue-600 text-white font-black p-5 rounded-3xl shadow-lg">ЗАПИСАТЬ НОВЫЕ РЕЗУЛЬТАТЫ</button>
            )}
            
            <div className="text-center">
                <button onClick={handleClearTraining} className="text-[10px] text-slate-300 uppercase tracking-widest p-2">Сбросить историю</button>
            </div>
        </div>
    );
};

            const renderCalculator = () => (
                <div className="p-4 text-center text-slate-500">
                    <h2 className="text-xl font-black text-slate-800 mb-4">Калькулятор</h2>
                    <p>Тут радар и расчеты ГТО...</p>
                </div>
            );

            const renderProfile = () => (
                <div className="p-4 text-center text-slate-500">
                    <h2 className="text-xl font-black text-slate-800 mb-4">Профиль</h2>
                    <p>Тут витрина ачивок и статистика...</p>
                </div>
            );

            const renderPlan = () => (
                <div className="p-4 text-center text-slate-500">
                    <h2 className="text-xl font-black text-slate-800 mb-4">План</h2>
                    <p>Тут рекомендации...</p>
                </div>
            );

            return (
                <div className="min-h-screen">
                    <div className="bg-blue-600 p-6 text-white rounded-b-3xl shadow-md mb-6">
                        <h1 className="text-2xl font-black tracking-widest">ТРЕКЕР</h1>
                    </div>
                    
                    {view === 'training' && renderTraining()}
                    {view === 'calculator' && renderCalculator()}
                    {view === 'profile' && renderProfile()}
                    {view === 'plan' && renderPlan()}

                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-2 flex justify-around shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-50">
                        {['training', 'calculator', 'profile', 'plan'].map((v) => (
                            <button key={v} onClick={() => switchView(v)} className={`text-xs font-bold uppercase p-2 ${view === v ? 'text-blue-600' : 'text-slate-400'}`}>
                                {v}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
