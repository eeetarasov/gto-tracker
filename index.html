<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ГТО PRO_TRACKER</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .lace-pattern {
            background-image: 
                radial-gradient(circle at center, rgba(255,255,255,0.15) 2px, transparent 2.5px),
                radial-gradient(circle at center, rgba(255,255,255,0.1) 1px, transparent 1.5px);
            background-size: 24px 24px, 12px 12px;
            background-position: 0 0, 12px 12px;
        }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        @keyframes slideDown {
            from { transform: translate(-50%, -120%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .animate-toast {
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-20 selection:bg-blue-200 relative">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const gtoData = [
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Скоростные возможности', name: 'Бег на 60 м', unit: 'с', gold: 8.8, silver: 10.9, bronze: 12.3 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Выносливость', name: 'Бег на 3000 м', unit: 'мин:с', gold: '13:00', silver: '14:30', bronze: '15:30' },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Выносливость', name: 'Кросс на 5 км', unit: 'мин:с', gold: '22:30', silver: '26:00', bronze: '28:30' },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Выносливость', name: 'Бег на 1000 м', unit: 'мин:с', gold: '3:45', silver: '4:06', bronze: '5:02' },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Выносливость', name: 'Бег на лыжах на 5 км', unit: 'мин:с', gold: '23:00', silver: '26:30', bronze: '29:30' },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Гибкость', name: 'Наклон вперед (см)', unit: 'см', gold: 11, silver: 5, bronze: 3 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Сила', name: 'Подтягивание на высокой перекладине', unit: 'раз', gold: 13, silver: 8, bronze: 4 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Сила', name: 'Сгибание рук в упоре лежа', unit: 'раз', gold: 33, silver: 19, bronze: 15 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Сила', name: 'Рывок гири 16 кг', unit: 'раз', gold: 40, silver: 22, bronze: 18 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Сила', name: 'Подтягивание на низкой перекладине 90 см', unit: 'раз', gold: 23, silver: 15, bronze: 10 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Скоростно-силовые возможности', name: 'Прыжок в длину с места', unit: 'см', gold: 234, silver: 213, bronze: 197 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Скоростно-силовые возможности', name: 'Поднимание туловища за 1 мин', unit: 'раз', gold: 42, silver: 32, bronze: 25 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Метание спортивного снаряда 700 г', unit: 'м', gold: 35, silver: 30, bronze: 26 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Плавание на 50 м', unit: 'мин:с', gold: '0:55', silver: '1:05', bronze: '1:22' },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Стрельба (открытый прицел)', unit: 'очки', gold: 25, silver: 20, bronze: 15 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Стрельба (электронное оружие)', unit: 'очки', gold: 30, silver: 25, bronze: 18 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Туристский поход', unit: 'навыков', gold: 7, silver: 5, bronze: 3 },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Скоростные возможности', name: 'Бег на 60 м', unit: 'с', gold: 9.8, silver: 10.5, bronze: 11.4 },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Скоростные возможности', name: 'Бег на 100 м', unit: 'с', gold: 16.7, silver: 17.9, bronze: 19.1 },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Выносливость', name: 'Бег на 1000 м', unit: 'мин:с', gold: '4:20', silver: '4:40', bronze: '5:10' },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Выносливость', name: 'Бег на 2000 м', unit: 'мин:с', gold: '11:15', silver: '12:50', bronze: '14:20' },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Выносливость', name: 'Кросс на 3 км', unit: 'мин:с', gold: '17:40', silver: '19:50', bronze: '22:30' },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Выносливость', name: 'Бег на лыжах на 3 км', unit: 'мин:с', gold: '18:10', silver: '20:20', bronze: '23:00' },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Гибкость', name: 'Наклон вперед (см)', unit: 'см', gold: 14, silver: 9, bronze: 7 },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Сила', name: 'Сгибание рук в упоре лежа', unit: 'раз', gold: 17, silver: 12, bronze: 8 },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Сила', name: 'Подтягивание на низкой перекладине 90 см', unit: 'раз', gold: 18, silver: 12, bronze: 8 }
        ];

        const gtoQuotaData = { 'М_10': { 'gold': 6, 'silver': 5, 'bronze': 5 }, 'Ж_9': { 'gold': 6, 'silver': 5, 'bronze': 5 } };
        const badgeValues = { 'gold': 3, 'silver': 2, 'bronze': 1, 'none': 0 };

        const getPlural = (num) => {
            if (num % 10 === 1 && num % 100 !== 11) return 'состязание';
            if ([2, 3, 4].includes(num % 10) && ![12, 13, 14].includes(num % 100)) return 'состязания';
            return 'состязаний';
        };

        const parseTime = (val, unit) => {
            if (!val) return null;
            if (typeof val === 'number') return val;
            val = val.toString().replace(',', '.');
            if (val.includes(':')) {
                const parts = val.split(':');
                return parseInt(parts[0] || 0) * 60 + parseFloat(parts[1] || 0);
            }
            const floatVal = parseFloat(val);
            return unit === 'мин:с' ? floatVal * 60 : floatVal;
        };

        const formatGap = (gap, unit) => {
            if (unit === 'мин:с') {
                const m = Math.floor(gap / 60);
                const s = Math.floor(gap % 60);
                return m > 0 ? `${m} мин ${s} с` : `${s} с`;
            }
            return `${Math.round(gap * 10) / 10} ${unit}`;
        };

        const calculatePercentage = (discipline, inputValue) => {
            if (!inputValue) return 0;
            const val = parseTime(inputValue, discipline.unit);
            const g = parseTime(discipline.gold, discipline.unit);
            if (!val || !g) return 0;
            const isTime = discipline.unit === 'с' || discipline.unit === 'мин:с';
            let pct = isTime ? (g / val) * 100 : (val / g) * 100;
            return Math.min(pct, 150); 
        };

        const calculateResult = (discipline, inputValue) => {
            if (!inputValue) return null;
            const val = parseTime(inputValue, discipline.unit);
            const g = parseTime(discipline.gold, discipline.unit);
            const s = parseTime(discipline.silver, discipline.unit);
            const b = parseTime(discipline.bronze, discipline.unit);
            const isTime = discipline.unit === 'с' || discipline.unit === 'мин:с';

            if (isTime) {
                if (val <= g) return { badge: 'gold', nextBadge: null, gap: 0 };
                if (val <= s) return { badge: 'silver', nextBadge: 'gold', gap: val - g };
                if (val <= b) return { badge: 'bronze', nextBadge: 'silver', gap: val - s };
                return { badge: 'none', nextBadge: 'bronze', gap: val - b };
            } else {
                if (val >= g) return { badge: 'gold', nextBadge: null, gap: 0 };
                if (val >= s) return { badge: 'silver', nextBadge: 'gold', gap: g - val };
                if (val >= b) return { badge: 'bronze', nextBadge: 'silver', gap: s - val };
                return { badge: 'none', nextBadge: 'bronze', gap: b - val };
            }
        };

        const getDateString = (date) => {
            const d = new Date(date);
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        };

        const App = () => {
            const [view, setView] = useState('training'); 
            const [gender, setGender] = useState('М');
            const [inputs, setInputs] = useState({});
            const [dailyData, setDailyData] = useState({}); 
            const [userName, setUserName] = useState('Атлет');
            const [userId, setUserId] = useState(null);
            const [userPhoto, setUserPhoto] = useState(null);
            const [expandedCategories, setExpandedCategories] = useState({});
            
            const [toast, setToast] = useState(null);
            const toastTimer = useRef(null);

            const todayStr = getDateString(new Date());

            const showToast = (message) => {
                if (toastTimer.current) clearTimeout(toastTimer.current);
                setToast(message);
                toastTimer.current = setTimeout(() => setToast(null), 4000);
            };

            useEffect(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (tgUser) {
                        setUserName(tgUser.first_name);
                        setUserId(tgUser.id.toString());
                        if (tgUser.photo_url) setUserPhoto(tgUser.photo_url);
                    } else {
                        setUserId('guest');
                    }
                } else {
                    setUserId('guest');
                }
            }, []);

            useEffect(() => {
                if (!userId) return;
                const savedGto = localStorage.getItem(`gto_${userId}_${gender}`);
                if (savedGto) {
                    try { setInputs(JSON.parse(savedGto)); } catch (e) {}
                } else {
                    setInputs({});
                }
                const savedDaily = localStorage.getItem(`gto_daily_${userId}`);
                if (savedDaily) {
                    try { setDailyData(JSON.parse(savedDaily)); } catch (e) {}
                } else {
                    setDailyData({});
                }
                setExpandedCategories({});
            }, [userId, gender]);

            const handleInput = (name, val) => {
                const newInputs = { ...inputs, [name]: val };
                setInputs(newInputs);
                if (userId) localStorage.setItem(`gto_${userId}_${gender}`, JSON.stringify(newInputs));
            };

            const handleClear = () => {
                if (window.confirm('Точно очистить все введенные результаты ГТО?')) {
                    setInputs({});
                    if (userId) localStorage.removeItem(`gto_${userId}_${gender}`);
                }
            };

            // ФУНКЦИИ ТРЕНИРОВОК С ПОШТУЧНОЙ БЛОКИРОВКОЙ
            const lockTodayTraining = () => {
                const todayData = dailyData[todayStr] || {};
                let hasNew = false;
                const newDaily = { ...dailyData };

                if (!newDaily[todayStr]) newDaily[todayStr] = {};

                // Проверяем каждое упражнение
                ['run', 'pushups', 'flex', 'sprint'].forEach(ex => {
                    const exData = todayData[ex] || {};
                    // Если упражнение не залочено и в нем есть какие-то значения
                    if (!exData.isLocked) {
                        const hasValues = Object.keys(exData).some(k => k !== 'isLocked' && exData[k] !== '' && exData[k] !== 0);
                        if (hasValues) {
                            newDaily[todayStr][ex] = { ...exData, isLocked: true };
                            hasNew = true;
                        }
                    }
                });

                if (!hasNew) {
                    showToast('Сначала введи новые результаты! 📝');
                    return;
                }

                setDailyData(newDaily);
                if (userId) localStorage.setItem(`gto_daily_${userId}`, JSON.stringify(newDaily));
                showToast('Новые результаты зафиксированы! 🎉');
            };

            const handleDailyInput = (exercise, field, val) => {
                // Блокируем только если КОНКРЕТНОЕ упражнение уже сохранено
                if (dailyData[todayStr]?.[exercise]?.isLocked) return;

                if (field === 'km' && parseFloat(val) > 50) {
                    showToast('Ультрамарафон на тренировке? Оставим это киборгам! 🏃‍♂️');
                    return;
                }
                if (field === 'cm' && (parseFloat(val) > 40 || parseFloat(val) < -40)) {
                    showToast('Твоей растяжке позавидует Человек-Паук! Но давай без магии. 🕷️');
                    return;
                }

                const newDaily = { ...dailyData };
                if (!newDaily[todayStr]) newDaily[todayStr] = {};
                if (!newDaily[todayStr][exercise]) newDaily[todayStr][exercise] = {};
                
                newDaily[todayStr][exercise][field] = val;
                
                if (val === '' || val === 0) {
                    delete newDaily[todayStr][exercise][field];
                    if (Object.keys(newDaily[todayStr][exercise]).length === 0) delete newDaily[todayStr][exercise];
                    if (Object.keys(newDaily[todayStr]).length === 0) delete newDaily[todayStr];
                }

                setDailyData(newDaily);
                if (userId) localStorage.setItem(`gto_daily_${userId}`, JSON.stringify(newDaily));
            };

            const updatePushups = (delta) => {
                if (dailyData[todayStr]?.pushups?.isLocked) return;
                
                const current = dailyData[todayStr]?.pushups?.count || 0;
                const next = Math.max(0, current + delta);
                
                if (next > 200 && delta > 0) {
                    showToast('Киборг, помноженный на вечность? Вводи реальные цифры! 🤖');
                    return;
                }
                
                handleDailyInput('pushups', 'count', next);
            };

            const validateSprint = () => {
                if (dailyData[todayStr]?.sprint?.isLocked) return;
                const val = parseFloat(dailyData[todayStr]?.sprint?.sec);
                if (val > 0 && val < 6.0) {
                    showToast('Полегче, Усейн Болт! Мировой рекорд 6.39с ⚡');
                    handleDailyInput('sprint', 'sec', '');
                }
            };

            const validateRun = () => {
                if (dailyData[todayStr]?.run?.isLocked) return;
                const km = parseFloat(dailyData[todayStr]?.run?.km);
                const timeStr = dailyData[todayStr]?.run?.time;
                if (km > 0 && timeStr) {
                    const timeSec = parseTime(timeStr, 'мин:с');
                    if (timeSec > 0) {
                        const speed = km / (timeSec / 3600); 
                        if (speed > 25) {
                            showToast('Эй, Флэш! С такой скоростью можно добежать до Вологды за пару часов 🏍️');
                            handleDailyInput('run', 'time', ''); 
                        }
                    }
                }
            };

            const toggleCategory = (cat) => {
                setExpandedCategories(prev => ({ ...prev, [cat]: !prev[cat] }));
            };

            const currentData = useMemo(() => gtoData.filter(d => d.gender === gender), [gender]);
            const results = useMemo(() => {
                return currentData.map(d => {
                    const res = calculateResult(d, inputs[d.name]);
                    return { ...d, result: res };
                }).filter(d => d.result !== null);
            }, [currentData, inputs]);

            const bestResultsByCategory = useMemo(() => {
                const best = {};
                results.forEach(r => {
                    const currentBadgeVal = badgeValues[r.result.badge];
                    if (!best[r.category] || currentBadgeVal > badgeValues[best[r.category].result.badge]) {
                        best[r.category] = r;
                    }
                });
                return Object.values(best);
            }, [results]);

            const worstExecutedBadge = useMemo(() => {
                if (bestResultsByCategory.length === 0) return 'none';
                const executedBadges = bestResultsByCategory.map(r => badgeValues[r.result.badge]);
                const worstVal = Math.min(...executedBadges);
                return Object.keys(badgeValues).find(key => badgeValues[key] === worstVal);
            }, [bestResultsByCategory]);

            const radarData = useMemo(() => {
                const scores = { 'Скорость': [], 'Выносливость': [], 'Сила': [], 'Гибкость': [], 'Навыки': [] };
                bestResultsByCategory.forEach(r => {
                    const pct = calculatePercentage(r, inputs[r.name]);
                    if (r.category === 'Скоростные возможности') scores['Скорость'].push(pct);
                    if (r.category === 'Выносливость') scores['Выносливость'].push(pct);
                    if (r.category === 'Сила') scores['Сила'].push(pct);
                    if (r.category === 'Гибкость') scores['Гибкость'].push(pct);
                    if (r.category === 'Прикладные навыки') scores['Навыки'].push(pct);
                    if (r.category === 'Скоростно-силовые возможности') {
                        scores['Скорость'].push(pct);
                        scores['Сила'].push(pct);
                    }
                });
                const getAvg = (arr) => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
                return [
                    { subject: 'Скорость', val: getAvg(scores['Скорость']) },
                    { subject: 'Выносливость', val: getAvg(scores['Выносливость']) },
                    { subject: 'Сила', val: getAvg(scores['Сила']) },
                    { subject: 'Гибкость', val: getAvg(scores['Гибкость']) },
                    { subject: 'Навыки', val: getAvg(scores['Навыки']) },
                ];
            }, [bestResultsByCategory, inputs]);

            const renderTraining = () => {
                let currentStreak = 0;
                let checkDate = new Date();
                
                // Функция проверки, был ли день активным (есть хотя бы одно залоченное упражнение)
                const isDayLocked = (dStr) => Object.values(dailyData[dStr] || {}).some(ex => ex?.isLocked);

                if (!isDayLocked(getDateString(checkDate))) {
                    checkDate.setDate(checkDate.getDate() - 1);
                }

                while (true) {
                    const dStr = getDateString(checkDate);
                    if (isDayLocked(dStr)) {
                        currentStreak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else {
                        break;
                    }
                }

                const last7Days = Array.from({length: 7}, (_, i) => {
                    const d = new Date();
                    d.setDate(d.getDate() - (6 - i));
                    return getDateString(d);
                });

                const todayRun = dailyData[todayStr]?.run || {};
                const todayPushups = dailyData[todayStr]?.pushups || {};
                const todayFlex = dailyData[todayStr]?.flex || {};
                const todaySprint = dailyData[todayStr]?.sprint || {};

                // Проверяем, есть ли что-то новое для сохранения
                const todayData = dailyData[todayStr] || {};
                const hasUnlockedData = Object.keys(todayData).some(ex => {
                    const exData = todayData[ex];
                    return !exData.isLocked && Object.keys(exData).some(k => k !== 'isLocked' && exData[k] !== '' && exData[k] !== 0);
                });
                const hasLockedData = Object.values(todayData).some(ex => ex.isLocked);

                return (
                    <div className="px-4 space-y-6 pt-6 pb-6 mb-6">
                        
                        <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-50">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest">Серия побед</h3>
                                <div className="flex items-center gap-1.5 bg-orange-50 px-3 py-1 rounded-full">
                                    <span className="text-orange-500 text-lg">🔥</span>
                                    <span className="font-bold text-orange-600">{currentStreak} дней</span>
                                </div>
                            </div>
                            <div className="flex justify-between items-end gap-1">
                                {last7Days.map((dStr, idx) => {
                                    const isLocked = isDayLocked(dStr);
                                    const isToday = idx === 6;
                                    return (
                                        <div key={dStr} className="flex flex-col items-center gap-1.5">
                                            <div className={`w-8 rounded-xl transition-all duration-300 ${isLocked ? 'bg-gradient-to-t from-blue-600 to-blue-400 shadow-sm shadow-blue-500/20' : 'bg-slate-100'} ${isToday ? 'h-12' : 'h-8'}`}></div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>

                        <h2 className="text-sm font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 pt-2">Ежедневный трекинг</h2>

                        {/* КАРТОЧКА БЕГА */}
                        <div className="bg-white p-5 rounded-3xl shadow-sm transition-opacity duration-300 relative" style={{ opacity: todayRun.isLocked ? 0.7 : 1 }}>
                            {todayRun.isLocked && <div className="absolute top-4 right-4 text-green-500 bg-green-50 rounded-full p-1"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg></div>}
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center text-xl">🏃‍♂️</div>
                                <div>
                                    <h3 className="font-bold text-slate-800">А ты сегодня бегал?</h3>
                                    <p className="text-xs text-slate-400 font-medium">Выносливость</p>
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <div className="w-1/2 relative">
                                    <input type="text" inputMode="decimal" placeholder="0" value={todayRun.km || ''} onChange={(e) => handleDailyInput('run', 'km', e.target.value)} onBlur={validateRun} disabled={todayRun.isLocked} className="w-full bg-slate-50 disabled:bg-transparent disabled:border-2 disabled:border-slate-100 text-right text-lg font-mono font-semibold text-blue-600 disabled:text-slate-500 rounded-xl py-3 pr-10 pl-3 focus:outline-none focus:ring-2 focus:ring-emerald-200" />
                                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-slate-400">КМ</span>
                                </div>

                const points = radarData.map((d, i) => {
                    const angle = -Math.PI / 2 + (2 * Math.PI * i) / 5;
                    const r = (d.val / 100) * maxRadius;
                    return { x: center + r * Math.cos(angle), y: center + r * Math.sin(angle), labelX: center + (maxRadius + 30) * Math.cos(angle), labelY: center + (maxRadius + 22) * Math.sin(angle), label: d.subject };
                });

                const userPath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x},${p.y}`).join(' ') + ' Z';
                
                const renderPolygon = (level) => {
                    const r = (level / 100) * maxRadius;
                    const pts = [0,1,2,3,4].map(i => {
                        const a = -Math.PI / 2 + (2 * Math.PI * i) / 5;
                        return `${center + r * Math.cos(a)},${center + r * Math.sin(a)}`;
                    }).join(' L ') + ' Z';
                    return <path d={`M ${pts}`} fill="none" stroke={level === 100 ? '#cbd5e1' : '#f1f5f9'} strokeWidth={level === 100 ? 2 : 1} strokeDasharray={level !== 100 ? "4,4" : "none"} />;
                };

                return (

                                {renderPolygon(50)}
                                {renderPolygon(150)}
                                {[0,1,2,3,4].map(i => {
                                    const a = -Math.PI / 2 + (2 * Math.PI * i) / 5;
                                    return <line key={i} x1={center} y1={center} x2={center + 1.5 * maxRadius * Math.cos(a)} y2={center + 1.5 * maxRadius * Math.sin(a)} stroke="#f1f5f9" strokeWidth="1" />;
                                })}
                                <path d={`M ${[0,1,2,3,4].map(i => {
                                    const a = -Math.PI / 2 + (2 * Math.PI * i) / 5;
                                    return `${center + maxRadius * Math.cos(a)},${center + maxRadius * Math.sin(a)}`;
                                }).join(' L ')} Z`} fill="#f8fafc" stroke="#94a3b8" strokeWidth="2" opacity="0.4"/>
                                <path d={userPath} fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" strokeWidth="3" strokeLinejoin="round" />
                                {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="4" fill="#ffffff" stroke="#2563eb" strokeWidth="2" />)}
                                {points.map((p, i) => <text key={i} x={p.labelX} y={p.labelY} textAnchor="middle" dominantBaseline="middle" className="text-[10px] font-bold fill-slate-500 uppercase tracking-widest">{p.label}</text>)}
                            </svg>
                        </div>

                const reqOptionalSilver = currentQuotas.silver - reqMandatory;

                                            <span className={executedOptionalCount >= reqOptionalSilver ? 'text-green-600' : 'text-red-600'}>{executedOptionalCount}</span> <span className="text-xs font-medium text-slate-400">из {reqOptionalGold}</span>

                                    Ближайшие цели
                                </h3>
                                <div className="space-y-4">
                                    {bestResultsByCategory.filter(r => r.result.badge !== 'gold').map(d => (
                                        <div key={d.name} className="flex justify-between items-center border-b border-slate-50 pb-3 last:border-0 last:pb-0">
                                            <p className="text-sm font-medium text-slate-700 w-1/2 pr-2 leading-tight">{d.name}</p>
                                            <div className="text-right">
                                                <p className={`text-[10px] uppercase font-bold tracking-wider ${{'gold': 'text-yellow-600', 'silver': 'text-slate-500', 'bronze': 'text-orange-600'}[d.result.nextBadge]}`}>
                                                    Цель: {badgeNames[d.result.nextBadge]}

                                                <p className="text-sm font-mono font-bold text-slate-900 whitespace-nowrap mt-0.5">

                          </div>
                        )}
                    </div>
                );
            };

            const renderPlan = () => {
                const executedDeficits = bestResultsByCategory.filter(r => r.result.badge !== 'gold');
                if (executedDeficits.length === 0) {
                    return <div className="px-4 text-center text-slate-500 mt-10">У вас нет отставаний по ГТО! Тренировки идут по плану.</div>;
                }

                const weakCategories = [...new Set(executedDeficits.map(d => d.category))];
                
                const adviceMap = {
                    'Скоростные возможности': { title: 'Интервалы', text: 'Спринты 5х30м с максимальной отдачей. Отдых 2-3 минуты до полного восстановления дыхания.' },
                    'Выносливость': { title: 'Равномерный бег', text: 'Длительный кросс 2-3 раза в неделю (30-40 мин) на низком пульсе, чтобы можно было спокойно разговаривать.' },
                    'Сила': { title: 'Работа "в отказ"', text: '3-4 подхода на максимум повторений (3 раза в неделю). Обязательно отдыхайте 1-2 дня между тренировками.' },
                    'Гибкость': { title: 'Статическая растяжка', text: 'Наклоны с удержанием в нижней точке на 20-30 секунд. Выполняйте на разогретые мышцы без рывков.' },
                    'Скоростно-силовые возможности': { title: 'Взрывная сила', text: 'Тренируйте прыжки на тумбу и регулярно выполняйте упражнения на пресс (скручивания, планка).' },
                    'Прикладные навыки': { title: 'Специфическая подготовка', text: 'Выберите вашу самую сильную дисциплину (плавание, стрельба или метание) и уделите основное внимание отработке техники.' }
                };

                return (
                    <div className="px-4 space-y-4 pt-6 mb-6">
                        {weakCategories.map(cat => (
                            <div key={cat} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col">
                                <div className="flex items-center justify-between mb-3">
                                    <span className="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">{cat}</span>
                                </div>
                                <h3 className="font-bold text-slate-900 text-lg leading-tight mb-2">{adviceMap[cat]?.title || 'Тренировка'}</h3>
                                <p className="text-slate-500 text-sm leading-relaxed">{adviceMap[cat]?.text || 'Продолжайте регулярные тренировки для улучшения результата в этой категории.'}</p>
                            </div>
                        ))}
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 w-11/12 max-w-sm bg-slate-800 text-white px-4 py-3 rounded-2xl shadow-2xl z-[100] flex items-center gap-3 animate-toast">
                            <div className="text-2xl">🚨</div>
                            <p className="text-sm font-medium leading-tight">{toast}</p>
                        </div>
                    )}

                    <div className="bg-blue-600 text-white p-6 pb-12 rounded-b-[2.5rem] shadow-md relative overflow-hidden mb-[-2rem]">
                        <div className="absolute inset-0 lace-pattern opacity-30"></div>
                        <div className="relative z-10">
                            <div className="flex items-center gap-3 mb-6">
                                <img src="logo.png?v=2" alt="ГТО" className="h-10 w-auto object-contain drop-shadow-sm" />
                                <h1 className="text-2xl font-black tracking-widest text-white drop-shadow-sm">ТРЕКЕР</h1>
                            </div>
                            
                            <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                                <div className="flex items-center gap-3">
                                    {userPhoto ? (
                                        <img src={userPhoto} alt="Аватар" className="w-11 h-11 rounded-full border-2 border-white/30 object-cover shadow-sm" />
                                    ) : (
                                        <div className="w-11 h-11 rounded-full bg-blue-500/80 flex items-center justify-center text-white text-lg font-bold border-2 border-white/30 shadow-sm">
                                            {userName.charAt(0)}
                                        </div>
                                    )}
                                    <p className="text-white font-medium text-sm leading-tight drop-shadow-sm">
                                        Привет, {userName}!<br/>
                                        <span className="opacity-80 text-xs font-normal">Ступень {gender === 'М' ? '10 (Муж)' : '9 (Жен)'}</span>
                                    </p>
                                </div>
                                
                                <div className="flex bg-blue-900/40 p-1 rounded-full w-32 shadow-inner border border-white/10">
                                    <button onClick={() => setGender('М')} className={`flex-1 py-1.5 text-[11px] uppercase tracking-wider font-bold rounded-full transition-all ${gender === 'М' ? 'bg-white text-blue-600 shadow-sm' : 'text-blue-100 hover:text-white'}`}>Муж</button>
                                    <button onClick={() => setGender('Ж')} className={`flex-1 py-1.5 text-[11px] uppercase tracking-wider font-bold rounded-full transition-all ${gender === 'Ж' ? 'bg-white text-blue-600 shadow-sm' : 'text-blue-100 hover:text-white'}`}>Жен</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="relative z-20 mt-4">
                        {view === 'training' && renderTraining()}
                        {view === 'calculator' && renderCalculator()}
                        {view === 'dashboard' && renderDashboard()}
                        {view === 'plan' && renderPlan()}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.02)] z-50">
                        <div className="flex justify-around items-center h-16 max-w-md mx-auto px-2">
                            <button onClick={() => setView('training')} className={`flex flex-col items-center justify-center w-1/4 h-full ${view === 'training' ? 'text-blue-600' : 'text-slate-400'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                <span className="text-[10px] font-bold">Тренировка</span>
                            </button>
                            <button onClick={() => setView('calculator')} className={`flex flex-col items-center justify-center w-1/4 h-full ${view === 'calculator' ? 'text-blue-600' : 'text-slate-400'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                                <span className="text-[10px] font-bold">Калькулятор</span>
                            </button>
                            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center justify-center w-1/4 h-full ${view === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                <span className="text-[10px] font-bold">Анализ</span>
                            </button>
                            <button onClick={() => setView('plan')} className={`flex flex-col items-center justify-center w-1/4 h-full ${view === 'plan' ? 'text-blue-600' : 'text-slate-400'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                                <span className="text-[10px] font-bold">План</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
