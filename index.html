<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ГТО PRO_TRACKER</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .lace-pattern {
            background-image: 
                radial-gradient(circle at center, rgba(255,255,255,0.15) 2px, transparent 2.5px),
                radial-gradient(circle at center, rgba(255,255,255,0.1) 1px, transparent 1.5px);
            background-size: 24px 24px, 12px 12px;
            background-position: 0 0, 12px 12px;
        }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-20 selection:bg-blue-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const gtoData = [
            // МУЖЧИНЫ 10 СТУПЕНЬ - ОБЯЗАТЕЛЬНЫЕ
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Скоростные возможности', name: 'Бег на 60 м', unit: 'с', gold: 8.8, silver: 10.9, bronze: 12.3 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Выносливость', name: 'Бег на 3000 м', unit: 'мин:с', gold: '13:00', silver: '14:30', bronze: '15:30' },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Выносливость', name: 'Кросс на 5 км', unit: 'мин:с', gold: '22:30', silver: '26:00', bronze: '28:30' },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Выносливость', name: 'Бег на 1000 м', unit: 'мин:с', gold: '3:45', silver: '4:06', bronze: '5:02' },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Выносливость', name: 'Бег на лыжах на 5 км', unit: 'мин:с', gold: '23:00', silver: '26:30', bronze: '29:30' },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Гибкость', name: 'Наклон вперед (см)', unit: 'см', gold: 11, silver: 5, bronze: 3 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Сила', name: 'Подтягивание на высокой перекладине', unit: 'раз', gold: 13, silver: 8, bronze: 4 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Сила', name: 'Сгибание рук в упоре лежа', unit: 'раз', gold: 33, silver: 19, bronze: 15 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Сила', name: 'Рывок гири 16 кг', unit: 'раз', gold: 40, silver: 22, bronze: 18 },
            { stage: 10, gender: 'М', type: 'Обязательное', category: 'Сила', name: 'Подтягивание на низкой перекладине 90 см', unit: 'раз', gold: 23, silver: 15, bronze: 10 },

            // МУЖЧИНЫ 10 СТУПЕНЬ - ПО ВЫБОРУ
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Скоростно-силовые возможности', name: 'Прыжок в длину с места', unit: 'см', gold: 234, silver: 213, bronze: 197 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Скоростно-силовые возможности', name: 'Поднимание туловища за 1 мин', unit: 'раз', gold: 42, silver: 32, bronze: 25 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Метание спортивного снаряда 700 г', unit: 'м', gold: 35, silver: 30, bronze: 26 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Плавание на 50 м', unit: 'мин:с', gold: '0:55', silver: '1:05', bronze: '1:22' },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Стрельба (открытый прицел)', unit: 'очки', gold: 25, silver: 20, bronze: 15 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Стрельба (электронное оружие)', unit: 'очки', gold: 30, silver: 25, bronze: 18 },
            { stage: 10, gender: 'М', type: 'По выбору', category: 'Прикладные навыки', name: 'Туристский поход', unit: 'навыков', gold: 7, silver: 5, bronze: 3 },

            // ЖЕНЩИНЫ 9 СТУПЕНЬ
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Скоростные возможности', name: 'Бег на 60 м', unit: 'с', gold: 9.8, silver: 10.5, bronze: 11.4 },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Скоростные возможности', name: 'Бег на 100 м', unit: 'с', gold: 16.7, silver: 17.9, bronze: 19.1 },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Выносливость', name: 'Бег на 1000 м', unit: 'мин:с', gold: '4:20', silver: '4:40', bronze: '5:10' },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Выносливость', name: 'Бег на 2000 м', unit: 'мин:с', gold: '11:15', silver: '12:50', bronze: '14:20' },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Выносливость', name: 'Кросс на 3 км', unit: 'мин:с', gold: '17:40', silver: '19:50', bronze: '22:30' },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Выносливость', name: 'Бег на лыжах на 3 км', unit: 'мин:с', gold: '18:10', silver: '20:20', bronze: '23:00' },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Гибкость', name: 'Наклон вперед (см)', unit: 'см', gold: 14, silver: 9, bronze: 7 },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Сила', name: 'Сгибание рук в упоре лежа', unit: 'раз', gold: 17, silver: 12, bronze: 8 },
            { stage: 9, gender: 'Ж', type: 'Обязательное', category: 'Сила', name: 'Подтягивание на низкой перекладине 90 см', unit: 'раз', gold: 18, silver: 12, bronze: 8 }
        ];

        const gtoQuotaData = {
          'М_10': {
            'gold': 6, 'silver': 5, 'bronze': 5 
          },
          'Ж_9': {
            'gold': 6, 'silver': 5, 'bronze': 5
          }
        };

        const badgeValues = { 'gold': 3, 'silver': 2, 'bronze': 1, 'none': 0 };

        const parseTime = (val, unit) => {
            if (!val) return null;
            if (typeof val === 'number') return val;
            val = val.toString().replace(',', '.');
            
            if (val.includes(':')) {
                const parts = val.split(':');
                return parseInt(parts[0] || 0) * 60 + parseFloat(parts[1] || 0);
            }
            
            const floatVal = parseFloat(val);
            if (unit === 'мин:с') {
                return floatVal * 60;
            }
            return floatVal;
        };

        const formatGap = (gap, unit) => {
            if (unit === 'мин:с') {
                const m = Math.floor(gap / 60);
                const s = Math.floor(gap % 60);
                return m > 0 ? `${m} мин ${s} с` : `${s} с`;
            }
            return `${Math.round(gap * 10) / 10} ${unit}`;
        };

        const calculateResult = (discipline, inputValue) => {
            if (!inputValue) return null;
            
            const val = parseTime(inputValue, discipline.unit);
            const g = parseTime(discipline.gold, discipline.unit);
            const s = parseTime(discipline.silver, discipline.unit);
            const b = parseTime(discipline.bronze, discipline.unit);
            const isTime = discipline.unit === 'с' || discipline.unit === 'мин:с';

            if (isTime) {
                if (val <= g) return { badge: 'gold', nextBadge: null, gap: 0 };
                if (val <= s) return { badge: 'silver', nextBadge: 'gold', gap: val - g };
                if (val <= b) return { badge: 'bronze', nextBadge: 'silver', gap: val - s };
                return { badge: 'none', nextBadge: 'bronze', gap: val - b };
            } else {
                if (val >= g) return { badge: 'gold', nextBadge: null, gap: 0 };
                if (val >= s) return { badge: 'silver', nextBadge: 'gold', gap: g - val };
                if (val >= b) return { badge: 'bronze', nextBadge: 'silver', gap: s - val };
                return { badge: 'none', nextBadge: 'bronze', gap: b - val };
            }
        };

        const App = () => {
            const [view, setView] = useState('calculator');
            const [gender, setGender] = useState('М');
            const [inputs, setInputs] = useState({});
            const [userName, setUserName] = useState('Атлет');
            const [userId, setUserId] = useState(null);

            useEffect(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
                    if (tgUser) {
                        setUserName(tgUser.first_name);
                        setUserId(tgUser.id.toString());
                    } else {
                        setUserId('guest');
                    }
                } else {
                    setUserId('guest');
                }
            }, []);

            useEffect(() => {
                if (!userId) return;
                const saved = localStorage.getItem(`gto_${userId}_${gender}`);
                if (saved) {
                    try { setInputs(JSON.parse(saved)); } catch (e) {}
                } else {
                    setInputs({});
                }
            }, [userId, gender]);

            const handleInput = (name, val) => {
                const newInputs = { ...inputs, [name]: val };
                setInputs(newInputs);
                if (userId) {
                    localStorage.setItem(`gto_${userId}_${gender}`, JSON.stringify(newInputs));
                }
            };

            const handleClear = () => {
                if (window.confirm('Точно очистить все введенные результаты?')) {
                    setInputs({});
                    if (userId) {
                        localStorage.removeItem(`gto_${userId}_${gender}`);
                    }
                }
            };

            const currentData = useMemo(() => gtoData.filter(d => d.gender === gender), [gender]);
            
            const results = useMemo(() => {
                return currentData.map(d => {
                    const res = calculateResult(d, inputs[d.name]);
                    return { ...d, result: res };
                }).filter(d => d.result !== null);
            }, [currentData, inputs]);

            const bestResultsByCategory = useMemo(() => {
                const best = {};
                results.forEach(r => {
                    const currentBadgeVal = badgeValues[r.result.badge];
                    if (!best[r.category] || currentBadgeVal > badgeValues[best[r.category].result.badge]) {
                        best[r.category] = r;
                    }
                });
                return Object.values(best);
            }, [results]);

            const worstExecutedBadge = useMemo(() => {
                if (bestResultsByCategory.length === 0) return 'none';
                const executedBadges = bestResultsByCategory.map(r => badgeValues[r.result.badge]);
                const worstVal = Math.min(...executedBadges);
                return Object.keys(badgeValues).find(key => badgeValues[key] === worstVal);
            }, [bestResultsByCategory]);

            const renderCalculator = () => {
                const types = ['Обязательное', 'По выбору'];

                return (
                    <div className="px-4 space-y-8 pt-6"> 
                        {types.map(type => {
                            const typeData = currentData.filter(d => d.type === type);
                            if (typeData.length === 0) return null;
                            
                            const categories = [...new Set(typeData.map(d => d.category))];
                            
                            return (
                                <div key={type} className="space-y-4">
                                    <h2 className="text-sm font-black text-slate-400 uppercase tracking-widest ml-2 mb-2">
                                        {type === 'Обязательное' ? 'Обязательные испытания' : 'Испытания по выбору'}
                                    </h2>
                                    
                                    {categories.map(cat => (
                                        <div key={cat} className="bg-white p-5 rounded-3xl shadow-sm">
                                            <h3 className="text-lg font-bold text-slate-800 mb-4">{cat}</h3>
                                            <div className="space-y-4">
                                                {typeData.filter(d => d.category === cat).map(d => (
                                                    <div key={d.name} className="flex items-center justify-between border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                                                        <div className="w-1/2 pr-2">
                                                            <p className="text-sm font-medium text-slate-700 leading-tight">{d.name}</p>
                                                        </div>
                                                        <div className="w-1/2 relative flex items-center justify-end">
                                                            <input 
                                                                type="text" 
                                                                inputMode="decimal"
                                                                value={inputs[d.name] || ''}
                                                                onChange={(e) => handleInput(d.name, e.target.value)}
                                                                placeholder="0"
                                                                className="w-full bg-slate-50 text-right text-lg font-mono font-semibold text-blue-600 rounded-xl py-2 pr-16 pl-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                                                            />
                                                            <span className="absolute right-3 text-[10px] font-bold text-slate-400 uppercase tracking-wide pointer-events-none select-none">
                                                                {d.unit}
                                                            </span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            );
                        })}
                        
                        <div className="flex gap-3 pt-4">
                            <button 
                                onClick={() => setView('dashboard')}
                                className="w-2/3 bg-blue-600 text-white font-bold text-lg py-4 rounded-3xl shadow-lg shadow-blue-600/30 active:scale-95 transition-transform"
                            >
                                РАССЧИТАТЬ
                            </button>
                            <button 
                                onClick={handleClear}
                                className="w-1/3 bg-slate-200 text-slate-600 font-bold text-sm py-4 rounded-3xl active:scale-95 transition-transform flex items-center justify-center"
                            >
                                ОЧИСТИТЬ
                            </button>
                        </div>
                    </div>
                );
            };

            const renderDashboard = () => {
                if (results.length === 0) {
                    return (
                        <div className="px-4 text-center mt-10">
                            <p className="text-slate-500 mb-4">Вы еще не ввели результаты.</p>
                            <button onClick={() => setView('calculator')} className="text-blue-600 font-semibold border border-blue-600 px-6 py-2 rounded-full">Вернуться к вводу</button>
                        </div>
                    );
                }

                const currentKey = `${gender}_${gender === 'М' ? 10 : 9}`;
                const currentQuotas = gtoQuotaData[currentKey] || gtoQuotaData['М_10']; 
                
                // РАЗДЕЛЕНИЕ НА ОБЯЗАТЕЛЬНЫЕ И ПО ВЫБОРУ
                const mandatoryCategories = [...new Set(currentData.filter(d => d.type === 'Обязательное').map(d => d.category))];
                const reqMandatory = mandatoryCategories.length;
                const reqOptionalGold = currentQuotas.gold - reqMandatory;
                const reqOptionalSilver = currentQuotas.silver - reqMandatory;

                const executedMandatoryCount = mandatoryCategories.filter(cat => bestResultsByCategory.some(r => r.category === cat)).length;
                const executedOptionalCount = bestResultsByCategory.length - executedMandatoryCount;

                let badgeByQuota = 'none';
                if (executedMandatoryCount >= reqMandatory) {
                    if (executedOptionalCount >= reqOptionalGold) badgeByQuota = 'gold';
                    else if (executedOptionalCount >= reqOptionalSilver) badgeByQuota = 'silver';
                }

                // Финальный статус: минимум между квотой и слабым звеном
                const finalBadge = badgeValues[badgeByQuota] < badgeValues[worstExecutedBadge] ? badgeByQuota : worstExecutedBadge;

                const headerColors = {
                    'gold': 'bg-yellow-400 text-yellow-900',
                    'silver': 'bg-slate-300 text-slate-800',
                    'bronze': 'bg-orange-300 text-orange-900',
                    'none': 'bg-red-100 text-red-600'
                };

                const badgeNames = { 'gold': 'Золото', 'silver': 'Серебро', 'bronze': 'Бронза', 'none': 'Без знака' };

                return (
                    <div className="px-4 space-y-6">
                        <div className={`p-6 rounded-3xl shadow-sm text-center ${headerColors[finalBadge]} flex flex-col items-center justify-center`}>
                            <h2 className="text-xs uppercase tracking-wider font-bold opacity-70 mb-1">Ваш текущий статус</h2>
                            <p className="text-3xl font-black">{badgeNames[finalBadge]}</p>
                            {badgeByQuota === 'none' && <p className="text-xs mt-2 text-red-700">Минимумы по категориям не выполнены</p>}
                        </div>

                        {/* ОБНОВЛЕННЫЙ БЛОК КВОТ С ЖЕСТКИМ РАЗДЕЛЕНИЕМ */}
                        <div className="bg-white p-5 rounded-3xl shadow-sm">
                            <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                                <svg className="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                                Выполнение минимумов
                            </h3>
                            <div className="space-y-4 text-sm">
                                <div className="flex justify-between items-center border-b border-slate-50 pb-3">
                                    <p className="text-slate-700 w-2/3 leading-tight">Обязательных качеств</p>
                                    <div className="text-right w-1/3">
                                        <p className="text-xl font-bold text-slate-900">
                                            <span className={executedMandatoryCount >= reqMandatory ? 'text-green-600' : 'text-red-600'}>{executedMandatoryCount}</span> <span className="text-xs font-medium text-slate-400">из {reqMandatory}</span>
                                        </p>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center pb-1">
                                    <p className="text-slate-700 w-2/3 leading-tight">Качеств по выбору</p>
                                    <div className="text-right w-1/3">
                                        <p className="text-xl font-bold text-slate-900">
                                            <span className={executedOptionalCount >= reqOptionalSilver ? 'text-green-600' : 'text-red-600'}>{executedOptionalCount}</span> <span className="text-xs font-medium text-slate-400">из {reqOptionalGold}</span>
                                        </p>
                                        <p className="text-[9px] text-slate-400 mt-0.5 leading-none">мин. {reqOptionalSilver} для сер/бронз</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {worstExecutedBadge !== 'gold' && (
                            <div className="bg-white p-5 rounded-3xl shadow-sm">
                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                                    <svg className="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                                    Ближайшие цели (по вашим тестам)
                                </h3>
                                <div className="space-y-4">
                                    {bestResultsByCategory.filter(r => r.result.badge !== 'gold').map(d => (
                                        <div key={d.name} className="flex justify-between items-center border-b border-slate-50 pb-3 last:border-0 last:pb-0">
                                            <p className="text-sm font-medium text-slate-700 w-1/2 pr-2 leading-tight">{d.name}</p>
                                            <div className="text-right">
                                                <p className={`text-[10px] uppercase font-bold tracking-wider ${{'gold': 'text-yellow-600', 'silver': 'text-slate-500', 'bronze': 'text-orange-600'}[d.result.nextBadge]}`}>
                                                    Цель: {badgeNames[d.result.nextBadge]}
                                                </p>
                                                <p className="text-sm font-mono font-bold text-slate-900 whitespace-nowrap mt-0.5">
                                                    осталось <span className="text-blue-600">{formatGap(d.result.gap, d.unit)}</span>
                                                </p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {worstExecutedBadge === 'gold' && finalBadge === 'gold' && (
                          <div className="bg-white p-6 rounded-3xl text-center shadow-sm">
                              <p className="text-lg font-bold text-green-600">Все выполненные категории на Золото!</p>
                          </div>
                        )}
                    </div>
                );
            };

            const renderPlan = () => {
                const executedDeficits = bestResultsByCategory.filter(r => r.result.badge !== 'gold');
                if (executedDeficits.length === 0) {
                    return <div className="px-4 text-center text-slate-500 mt-10">У вас нет отставаний! Тренировки идут по плану.</div>;
                }

                const weakCategories = [...new Set(executedDeficits.map(d => d.category))];
                
                const adviceMap = {
                    'Скоростные возможности': { title: 'Интервалы', text: 'Спринты 5х30м с максимальной отдачей. Отдых 2-3 минуты до полного восстановления дыхания.' },
                    'Выносливость': { title: 'Равномерный бег', text: 'Длительный кросс 2-3 раза в неделю (30-40 мин) на низком пульсе, чтобы можно было спокойно разговаривать.' },
                    'Сила': { title: 'Работа "в отказ"', text: '3-4 подхода на максимум повторений (3 раза в неделю). Обязательно отдыхайте 1-2 дня между тренировками.' },
                    'Гибкость': { title: 'Статическая растяжка', text: 'Наклоны с удержанием в нижней точке на 20-30 секунд. Выполняйте на разогретые мышцы без рывков.' },
                    'Скоростно-силовые возможности': { title: 'Взрывная сила', text: 'Тренируйте прыжки на тумбу и регулярно выполняйте упражнения на пресс (скручивания, планка).' },
                    'Прикладные навыки': { title: 'Специфическая подготовка', text: 'Выберите вашу самую сильную дисциплину (плавание, стрельба или метание) и уделите основное внимание отработке техники.' }
                };

                return (
                    <div className="px-4 space-y-4">
                        {weakCategories.map(cat => (
                            <div key={cat} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col">
                                <div className="flex items-center justify-between mb-3">
                                    <span className="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">{cat}</span>
                                </div>
                                <h3 className="font-bold text-slate-900 text-lg leading-tight mb-2">{adviceMap[cat]?.title || 'Тренировка'}</h3>
                                <p className="text-slate-500 text-sm leading-relaxed">{adviceMap[cat]?.text || 'Продолжайте регулярные тренировки для улучшения результата в этой категории.'}</p>
                            </div>
                        ))}
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    <div className="bg-blue-600 text-white p-6 pb-12 rounded-b-[2.5rem] shadow-md relative overflow-hidden mb-[-2rem]">
                        <div className="absolute inset-0 lace-pattern opacity-30"></div>
                        <div className="relative z-10">
                            
                            <div className="flex items-center gap-3 mb-4">
                                <img 
                                    src="logo.png?v=2" 
                                    alt="ГТО" 
                                    className="h-10 w-auto object-contain drop-shadow-sm"
                                />
                                <h1 className="text-2xl font-black tracking-widest text-white drop-shadow-sm">PRO_TRACKER</h1>
                            </div>
                            
                            <p className="text-blue-200 font-medium text-sm">Привет, {userName}! Ступень {gender === 'М' ? '10 (Муж)' : '9 (Жен)'}</p>
                            
                            {view === 'calculator' && (
                                <div className="mt-5 flex bg-blue-700/50 p-1 rounded-full w-48 backdrop-blur-sm border border-blue-500/30">
                                    <button onClick={() => setGender('М')} className={`flex-1 py-1.5 text-sm font-bold rounded-full transition-all ${gender === 'М' ? 'bg-white text-blue-600 shadow-sm' : 'text-blue-100'}`}>Муж</button>
                                    <button onClick={() => setGender('Ж')} className={`flex-1 py-1.5 text-sm font-bold rounded-full transition-all ${gender === 'Ж' ? 'bg-white text-blue-600 shadow-sm' : 'text-blue-100'}`}>Жен</button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="relative z-20 mt-4">
                        {view === 'calculator' && renderCalculator()}
                        {view === 'dashboard' && renderDashboard()}
                        {view === 'plan' && renderPlan()}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.02)] z-50">
                        <div className="flex justify-around items-center h-16 max-w-md mx-auto">
                            <button onClick={() => setView('calculator')} className={`flex flex-col items-center justify-center w-1/3 h-full ${view === 'calculator' ? 'text-blue-600' : 'text-slate-400'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                <span className="text-[10px] font-bold">Ввод</span>
                            </button>
                            <button onClick={() => setView('dashboard')} className={`flex flex-col items-center justify-center w-1/3 h-full ${view === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                <span className="text-[10px] font-bold">Анализ</span>
                            </button>
                            <button onClick={() => setView('plan')} className={`flex flex-col items-center justify-center w-1/3 h-full ${view === 'plan' ? 'text-blue-600' : 'text-slate-400'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                                <span className="text-[10px] font-bold">План</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
